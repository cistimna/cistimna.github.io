name: Build EMBER
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          flutter create app --project-name ember --org com.ember --platforms android
          rm -rf app/lib app/test
          unzip -qo ember.zip -d app
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="EMBER"|' $M
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $M
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' app/android/app/build.gradle.kts || true
          cd app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: EMBER-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
